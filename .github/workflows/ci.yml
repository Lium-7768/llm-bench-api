# 持续集成：推送到 dev、向 dev 发起 PR、以及发版前都会跑这一套检查。
# 预览部署由 Vercel 的 GitHub 集成自动完成，这里不处理部署。

name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 检查与构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # 校验 PR 里每条提交信息需要完整历史
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 提交信息格式
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

      - name: ESLint
        run: pnpm lint

      - name: 格式检查
        run: pnpm format:check

      - name: 类型检查
        run: pnpm typecheck

      - name: 生产构建
        run: pnpm build

      - name: 冒烟测试
        run: |
          pnpm start -p 3000 > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/v1 > /dev/null && break
            sleep 1
          done
          BASE_URL=http://localhost:3000 pnpm smoke

      - name: 输出服务日志
        if: failure()
        run: cat server.log || true
