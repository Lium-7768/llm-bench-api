<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>计数器</title>
  </head>
  <body>
    <button id="dec">减</button> <span id="count">0</span> <button id="inc">加</button> <button id="reset">归零</button>
    <label>步长 <input id="step" type="number" value="1" /></label>
    <script>
      let n = 0;
      const $ = (id) => document.getElementById(id);
      const step = () => {
        const v = $("step").value.trim();
        return /^[1-5]$/.test(v) ? Number(v) : 1;
      };
      const render = () => {
        $("count").textContent = String(n);
        $("dec").disabled = n <= 0;
        $("inc").disabled = n >= 10;
      };
      $("inc").onclick = () => {
        n = Math.min(10, n + step());
        render();
      };
      $("dec").onclick = () => {
        n = Math.max(0, n - step());
        render();
      };
      $("reset").onclick = () => {
        n = 0;
        render();
      };
      render();
    </script>
  </body>
</html>
