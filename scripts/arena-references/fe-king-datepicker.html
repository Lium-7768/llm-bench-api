<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      #grid {
        display: grid;
        grid-template-columns: repeat(7, 36px);
      }
      #grid button,
      #grid span {
        width: 36px;
        height: 30px;
      }
    </style>
  </head>
  <body>
    <input id="date" data-min="2024-01-10" data-max="2024-12-20" /><button
      id="date-toggle"
      aria-haspopup="dialog"
      aria-expanded="false"
    >
      📅
    </button>
    <div id="calendar" role="dialog" aria-label="选择日期" hidden>
      <button id="prev-month">‹</button><span id="calendar-title"></span><button id="next-month">›</button>
      <div id="grid" role="grid"></div>
    </div>
    <script>
      const $ = (id) => document.getElementById(id);
      const input = $("date"),
        toggle = $("date-toggle"),
        cal = $("calendar"),
        grid = $("grid");
      const MIN = input.dataset.min,
        MAX = input.dataset.max;
      const pad = (n) => String(n).padStart(2, "0");
      const fmt = (y, m, d) => y + "-" + pad(m + 1) + "-" + pad(d);
      const dim = (y, m) => new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
      let selected = null,
        fy = 2024,
        fm = 2,
        fd = 15;
      const parse = (s) => {
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
        if (!m) return null;
        const y = +m[1],
          mo = +m[2] - 1,
          d = +m[3];
        if (mo < 0 || mo > 11 || d < 1 || d > dim(y, mo)) return null;
        return [y, mo, d];
      };
      const inRange = (s) => s >= MIN && s <= MAX;
      const render = (focusDay) => {
        $("calendar-title").textContent = fy + "年" + (fm + 1) + "月";
        grid.innerHTML = "";
        const lead = (new Date(Date.UTC(fy, fm, 1)).getUTCDay() + 6) % 7;
        for (let i = 0; i < lead; i++) grid.appendChild(document.createElement("span"));
        for (let d = 1; d <= dim(fy, fm); d++) {
          const s = fmt(fy, fm, d),
            b = document.createElement("button");
          b.dataset.date = s;
          b.textContent = d;
          b.tabIndex = d === fd ? 0 : -1;
          b.setAttribute("aria-selected", String(s === selected));
          if (!inRange(s)) b.setAttribute("aria-disabled", "true");
          b.addEventListener("click", () => choose(s));
          grid.appendChild(b);
        }
        if (focusDay) grid.querySelector('[data-date="' + fmt(fy, fm, fd) + '"]').focus();
      };
      const moveTo = (y, m, d) => {
        const t = new Date(Date.UTC(y, m, d));
        fy = t.getUTCFullYear();
        fm = t.getUTCMonth();
        fd = t.getUTCDate();
        render(true);
      };
      const shiftMonth = (k, focusDay) => {
        const t = new Date(Date.UTC(fy, fm + k, 1));
        fy = t.getUTCFullYear();
        fm = t.getUTCMonth();
        fd = Math.min(fd, dim(fy, fm));
        render(focusDay);
      };
      const open = () => {
        const p = selected && parse(selected);
        [fy, fm, fd] = p || [2024, 2, 15];
        cal.hidden = false;
        toggle.setAttribute("aria-expanded", "true");
        render(true);
      };
      const close = () => {
        cal.hidden = true;
        toggle.setAttribute("aria-expanded", "false");
        toggle.focus();
      };
      const choose = (s) => {
        if (!inRange(s)) return;
        selected = s;
        input.value = s;
        close();
      };
      toggle.addEventListener("click", () => (cal.hidden ? open() : close()));
      $("prev-month").addEventListener("click", () => shiftMonth(-1, false));
      $("next-month").addEventListener("click", () => shiftMonth(1, false));
      grid.addEventListener("keydown", (e) => {
        const k = e.key;
        let handled = true;
        if (k === "ArrowLeft") moveTo(fy, fm, fd - 1);
        else if (k === "ArrowRight") moveTo(fy, fm, fd + 1);
        else if (k === "ArrowUp") moveTo(fy, fm, fd - 7);
        else if (k === "ArrowDown") moveTo(fy, fm, fd + 7);
        else if (k === "Home" || k === "End") {
          const wd = (new Date(Date.UTC(fy, fm, fd)).getUTCDay() + 6) % 7;
          moveTo(fy, fm, fd - wd + (k === "End" ? 6 : 0));
        } else if (k === "PageUp" || k === "PageDown")
          shiftMonth((k === "PageUp" ? -1 : 1) * (e.shiftKey ? 12 : 1), true);
        else if (k === "Enter" || k === " ") choose(fmt(fy, fm, fd));
        else if (k === "Escape") close();
        else handled = false;
        if (handled) e.preventDefault();
      });
      input.addEventListener("change", () => {
        const p = parse(input.value.trim());
        if (p && inRange(input.value.trim())) selected = input.value.trim();
        input.value = selected || "";
      });
    </script>
  </body>
</html>
