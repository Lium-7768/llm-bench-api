<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
      }
      #viewport {
        height: 400px;
        overflow-y: auto;
        position: relative;
        outline: none;
      }
      #spacer {
        height: 320000px;
        position: relative;
      }
      .row {
        position: absolute;
        left: 0;
        right: 0;
        height: 32px;
        line-height: 32px;
        box-sizing: border-box;
      }
      .selected {
        background: #ddf;
      }
    </style>
  </head>
  <body>
    <div id="viewport" tabindex="0"><div id="spacer"></div></div>
    <p id="selected"></p>
    <script>
      const N = 10000,
        H = 32,
        vp = document.getElementById("viewport"),
        spacer = document.getElementById("spacer");
      let selected = -1;
      const render = () => {
        const start = Math.max(0, Math.floor(vp.scrollTop / H) - 5),
          end = Math.min(N, Math.ceil((vp.scrollTop + 400) / H) + 5);
        spacer.innerHTML = "";
        for (let i = start; i < end; i++) {
          const r = document.createElement("div");
          r.className = "row" + (i === selected ? " selected" : "");
          r.dataset.index = i;
          r.style.top = i * H + "px";
          r.textContent = "第 " + (i + 1) + " 行";
          spacer.appendChild(r);
        }
      };
      const select = (i) => {
        selected = i;
        document.getElementById("selected").textContent = "已选：第 " + (i + 1) + " 行";
        render();
      };
      vp.addEventListener("scroll", render);
      spacer.addEventListener("click", (e) => {
        const r = e.target.closest(".row");
        if (r) select(Number(r.dataset.index));
      });
      vp.addEventListener("keydown", (e) => {
        if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
        e.preventDefault();
        const i = selected < 0 ? 0 : Math.max(0, Math.min(N - 1, selected + (e.key === "ArrowDown" ? 1 : -1)));
        if (i * H < vp.scrollTop) vp.scrollTop = i * H;
        else if ((i + 1) * H > vp.scrollTop + 400) vp.scrollTop = (i + 1) * H - 400;
        select(i);
      });
      render();
    </script>
  </body>
</html>
