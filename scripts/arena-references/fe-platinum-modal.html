<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      #dlg-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
      }
      #dlg {
        position: fixed;
        top: 100px;
        left: 100px;
        width: 300px;
        height: 200px;
        background: #fff;
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <div id="main">
      <button id="open-dialog">打开</button>
      <p id="greeting"></p>
    </div>
    <div id="dlg-backdrop" hidden></div>
    <div id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-title" hidden>
      <h2 id="dlg-title">你的名字</h2>
      <input id="dlg-name" /><button id="dlg-cancel">取消</button><button id="dlg-confirm">确认</button>
      <p id="dlg-error"></p>
    </div>
    <script>
      const $ = (id) => document.getElementById(id);
      let saved = "";
      const open = () => {
        saved = document.body.style.overflow;
        document.body.style.overflow = "hidden";
        $("main").setAttribute("inert", "");
        $("dlg").hidden = false;
        $("dlg-backdrop").hidden = false;
        $("dlg-name").focus();
      };
      const close = () => {
        $("dlg").hidden = true;
        $("dlg-backdrop").hidden = true;
        $("main").removeAttribute("inert");
        document.body.style.overflow = saved;
        $("dlg-error").textContent = "";
        $("open-dialog").focus();
      };
      $("open-dialog").addEventListener("click", open);
      $("dlg-cancel").addEventListener("click", close);
      $("dlg-backdrop").addEventListener("click", close);
      $("dlg-confirm").addEventListener("click", () => {
        const v = $("dlg-name").value.trim();
        if (!v) {
          $("dlg-error").textContent = "请输入名字";
          return;
        }
        $("greeting").textContent = "你好，" + v;
        $("dlg-name").value = "";
        close();
      });
      $("dlg").addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          e.preventDefault();
          close();
        } else if (e.key === "Tab") {
          const first = $("dlg-name"),
            last = $("dlg-confirm");
          if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
          } else if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus();
          }
        }
      });
    </script>
  </body>
</html>
